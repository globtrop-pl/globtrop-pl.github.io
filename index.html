<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Globtrop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: full-bleed 3D "street view" stage; every screen is a layer of instrument-like panels over it. */
:root {
  --ink: #0d141b; --panel: rgba(13, 20, 27, .86); --panel-solid: #121b24; --line: rgba(236, 230, 214, .12);
  --paper: #f1ece0; --muted: #9ba7b1; --brand: #f2c14e; --brand-ink: #251c05;
  --red: #e5484d; --blue: #3e8bff; --ok: #3fbf72;
  --f-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
img { max-width: 100%; }
body { margin: 0; }
html, body { height: 100%; }
body { background: var(--ink); color: var(--paper); font-family: var(--f-body); overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font: inherit; cursor: pointer; border: 0; border-radius: 10px; padding: 11px 18px; background: var(--brand); color: var(--brand-ink); font-weight: 700; transition: transform .12s, filter .12s, background .12s; }
button:hover:not(:disabled) { filter: brightness(1.08); }
button:active:not(:disabled) { transform: translateY(1px); }
button:disabled { opacity: .45; cursor: default; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
button.ghost { background: transparent; color: var(--paper); box-shadow: inset 0 0 0 1.5px var(--line); }
button.ghost:hover { background: rgba(255,255,255,.06); }
button.small { padding: 7px 12px; font-size: 13px; border-radius: 8px; }
input[type=text] { font: inherit; color: var(--paper); background: rgba(255,255,255,.06); border: 1.5px solid var(--line); border-radius: 10px; padding: 11px 14px; width: 100%; min-width: 0; }
input[type=text]::placeholder { color: #6f7b86; }
.muted { color: var(--muted); font-size: 14px; line-height: 1.45; }
.label { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

#view { position: fixed; inset: 0; }
#view .sv { position: absolute; inset: 0; }
#view .sv-block { position: absolute; inset: 0; z-index: 3; }
body:not(.ingame) #view { visibility: hidden; }
#backdrop { position: fixed; inset: 0; opacity: .55; filter: saturate(.8); }
#backdrop canvas { pointer-events: none; }
body.ingame #backdrop { display: none; }
#searching { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 15; background: var(--panel-solid); padding: 16px 22px; border-radius: 14px; box-shadow: inset 0 0 0 1px var(--line), 0 20px 60px rgba(0,0,0,.5); font-weight: 700; display: flex; gap: 12px; align-items: center; }
#searching i { width: 18px; height: 18px; border-radius: 50%; border: 3px solid var(--brand); border-right-color: transparent; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#noKey { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: rgba(8,12,16,.9); padding: 16px; }
#noKey .endbox code { font-family: var(--f-mono); background: rgba(255,255,255,.08); padding: 2px 6px; border-radius: 5px; }
#view::after { z-index: 2; content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 85% 75% at 50% 45%, transparent 60%, rgba(0,0,0,.28) 100%); }
.screen { position: fixed; inset: 0; z-index: 2; }
.scrim { position: absolute; inset: 0; background: linear-gradient(100deg, rgba(10,15,21,.93) 0%, rgba(10,15,21,.78) 42%, rgba(10,15,21,.25) 100%); pointer-events: none; }

/* ---------- home */
#home .wrap, #setup .wrap, #lobby .wrap { position: relative; height: 100%; overflow-y: auto; padding-block: max(28px, env(safe-area-inset-top, 0px)) 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.inner { max-width: 1060px; margin: 0 auto; display: grid; gap: 28px; }
.brand { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.brand h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(54px, 9vw, 104px); line-height: .86; letter-spacing: -.035em; margin: 0; }
.brand h1 .o { display: inline-block; width: .62em; height: .62em; border-radius: 50%; border: .1em solid var(--brand); position: relative; top: .02em; margin: 0 .02em; }
.brand h1 .o::after { content: ""; position: absolute; left: 50%; top: -18%; bottom: -18%; width: .07em; background: var(--brand); transform: translateX(-50%) rotate(28deg); border-radius: 2px; }
.brand p { margin: 0 0 8px; font-size: 17px; color: var(--muted); max-width: 30ch; text-wrap: balance; }
.homegrid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 22px; align-items: start; }
@media (max-width: 820px) { .homegrid { grid-template-columns: minmax(0,1fr); } }
.nickrow { display: grid; gap: 8px; max-width: 380px; }
.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 520px) { .cards { grid-template-columns: minmax(0,1fr); } }
.card { text-align: left; background: var(--panel); color: var(--paper); border-radius: 16px; padding: 20px 20px 18px; box-shadow: inset 0 0 0 1px var(--line); display: grid; gap: 10px; align-content: start; min-height: 170px; position: relative; overflow: hidden; }
.card:hover { box-shadow: inset 0 0 0 1.5px var(--brand); filter: none; }
.card .k { font-family: var(--f-display); font-size: 26px; font-weight: 800; letter-spacing: -.01em; }
.card .d { color: var(--muted); font-size: 14px; line-height: 1.45; font-weight: 500; }
.card .tag { justify-self: start; font-size: 12px; font-weight: 700; color: var(--brand-ink); background: var(--brand); padding: 3px 9px; border-radius: 99px; margin-top: auto; }
.card .tag.alt { background: rgba(255,255,255,.1); color: var(--paper); }
.card svg { position: absolute; right: -14px; top: -14px; opacity: .14; }
.panel { background: var(--panel); border-radius: 16px; padding: 20px; box-shadow: inset 0 0 0 1px var(--line); display: grid; gap: 14px; backdrop-filter: blur(6px); }
.panel h2 { font-family: var(--f-display); font-size: 22px; margin: 0; font-weight: 800; }
#joinRow { display: flex; gap: 8px; }
.qpbtns { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.qpbtns button { font-family: var(--f-mono); font-size: 17px; padding: 13px 0; }
#joinRow input { text-transform: uppercase; font-family: var(--f-mono); letter-spacing: .12em; }
#joinRow.off { opacity: .45; pointer-events: none; }
.rooms { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.rooms li { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border-radius: 10px; background: rgba(255,255,255,.04); }
.rooms small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
.legend { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.legend div { font-size: 13px; color: var(--muted); line-height: 1.35; }
.legend b { display: block; color: var(--paper); font-family: var(--f-mono); font-size: 12px; letter-spacing: .06em; margin-bottom: 3px; }

/* ---------- setup */
.setupbox { max-width: 680px; margin: 0 auto; display: grid; gap: 22px; }
.setupbox h2 { font-family: var(--f-display); font-size: 40px; margin: 0; font-weight: 800; letter-spacing: -.02em; }
.opt { display: grid; gap: 10px; }
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg span { display: grid; gap: 2px; padding: 10px 14px; border-radius: 10px; background: rgba(255,255,255,.05); box-shadow: inset 0 0 0 1.5px var(--line); cursor: pointer; font-weight: 600; font-size: 15px; }
.seg span small { font-weight: 500; color: var(--muted); font-size: 12px; }
.seg span i { font-style: normal; }
.seg input:checked + span { box-shadow: inset 0 0 0 2px var(--brand); background: rgba(242,193,78,.1); }
.seg input:focus-visible + span { outline: 2px solid var(--brand); outline-offset: 2px; }
.lvlbox { display: grid; gap: 10px; padding: 16px; border-radius: 12px; background: rgba(255,255,255,.04); box-shadow: inset 0 0 0 1px var(--line); }
#lvl { -webkit-appearance: none; appearance: none; width: 100%; height: 8px; border-radius: 99px; background: linear-gradient(90deg, var(--brand) var(--p, 44%), rgba(255,255,255,.12) var(--p, 44%)); }
#lvl::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: var(--paper); border: 4px solid var(--brand); cursor: pointer; }
#lvl::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--paper); border: 4px solid var(--brand); cursor: pointer; }
.ticks { display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
#lvlName { font-family: var(--f-display); font-size: 22px; font-weight: 800; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }

/* ---------- lobby */
.lobbybox { max-width: 900px; margin: 0 auto; display: grid; gap: 20px; }
.lobbyhead { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 14px; }
.lobbyhead h2 { font-family: var(--f-display); font-size: 40px; margin: 0; font-weight: 800; }
#codeRow { display: flex; align-items: center; gap: 10px; }
#lobbyCode { font-family: var(--f-mono); font-size: 28px; font-weight: 700; letter-spacing: .18em; color: var(--brand); }
#lobbyTeams { display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); gap: 14px; align-items: start; }
@media (max-width: 640px) { #lobbyTeams { grid-template-columns: minmax(0,1fr); } .vs { justify-self: center; } }
.team { background: var(--panel); border-radius: 16px; padding: 16px; box-shadow: inset 0 0 0 1px var(--line); display: grid; gap: 10px; border-top: 4px solid var(--c); }
.team.t0 { --c: var(--red); } .team.t1 { --c: var(--blue); }
.team h3 { margin: 0; font-family: var(--f-display); font-size: 20px; color: var(--c); }
.team ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.team li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; background: rgba(255,255,255,.04); font-weight: 600; min-width: 0; }
.team li span:nth-child(2) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.team li.me { box-shadow: inset 0 0 0 1.5px var(--brand); }
.team li.empty { color: #6f7b86; font-weight: 500; }
.team li em { margin-left: auto; font-style: normal; font-size: 12px; color: var(--muted); font-weight: 500; white-space: nowrap; }
.av { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 13px; color: #fff; background: rgba(255,255,255,.08); flex: none; }
.vs { font-family: var(--f-display); font-weight: 800; font-size: 22px; color: var(--muted); align-self: center; }

/* ---------- game */
#game { pointer-events: none; }
#game > * { pointer-events: auto; }
.hud { position: absolute; top: max(12px, env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); display: flex; align-items: stretch; gap: 10px; max-width: calc(100% - 32px); }
.hud.team { width: min(760px, calc(100% - 32px)); }
.tbar { flex: 1; min-width: 0; background: var(--panel); border-radius: 12px; padding: 8px 12px 10px; display: grid; gap: 6px; box-shadow: inset 0 0 0 1px var(--line); }
.tbar.t1 { text-align: right; }
.tname { font-family: var(--f-display); font-weight: 800; font-size: 15px; }
.t0 .tname { color: var(--red); } .t1 .tname { color: var(--blue); }
.hpwrap { position: relative; height: 16px; border-radius: 6px; background: rgba(255,255,255,.08); overflow: hidden; }
.hp { position: absolute; inset: 0 auto 0 0; border-radius: 6px; transition: width .9s cubic-bezier(.2,.8,.2,1); }
.t0 .hp { background: var(--red); } .t1 .hp { background: var(--blue); left: auto; right: 0; }
.hpnum { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-mono); font-size: 11px; font-weight: 700; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
.dots { display: flex; gap: 4px; flex-wrap: wrap; }
.t1 .dots { justify-content: flex-end; }
.pdot { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 800; background: rgba(255,255,255,.1); color: var(--muted); }
.pdot.in { background: var(--ok); color: #062512; }
.pdot.me { box-shadow: 0 0 0 1.5px var(--brand); }
.mid { background: var(--panel); border-radius: 12px; padding: 8px 14px; display: grid; justify-items: center; align-content: center; gap: 2px; box-shadow: inset 0 0 0 1px var(--line); min-width: 92px; }
.rnd { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.mult { font-family: var(--f-mono); font-weight: 700; color: var(--brand); }
.timer { font-family: var(--f-mono); font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
.timer.urgent { color: var(--red); animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .55; } }
.hud.solo { background: var(--panel); border-radius: 12px; padding: 8px 16px; gap: 22px; align-items: center; box-shadow: inset 0 0 0 1px var(--line); }
.stat { display: grid; } .stat span { font-size: 11px; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; font-weight: 600; } .stat b { font-family: var(--f-mono); font-size: 17px; font-variant-numeric: tabular-nums; }
.topleft { position: absolute; top: max(12px, env(safe-area-inset-top, 0px)); left: max(12px, env(safe-area-inset-left, 0px)); display: grid; gap: 8px; justify-items: start; }
.compass { width: 54px; height: 54px; border-radius: 50%; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); display: grid; place-items: center; position: relative; }
#needle { width: 44px; height: 44px; transition: transform .08s linear; }
.badge { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; background: var(--panel); padding: 5px 9px; border-radius: 7px; box-shadow: inset 0 0 0 1px var(--line); }
.iconbtn { width: 42px; height: 42px; padding: 0; display: grid; place-items: center; border-radius: 10px; background: var(--panel); color: var(--paper); box-shadow: inset 0 0 0 1px var(--line); }
.iconbtn:hover { background: #1b2733; }
.leftctl { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: max(64px, calc(env(safe-area-inset-bottom, 0px) + 52px)); display: grid; gap: 8px; }
#moveCtl { position: absolute; left: 50%; transform: translateX(-50%); bottom: max(22px, calc(env(safe-area-inset-bottom, 0px) + 10px)); display: flex; gap: 10px; }
#moveCtl button { width: 52px; height: 52px; border-radius: 50%; padding: 0; background: rgba(255,255,255,.9); color: #111; display: grid; place-items: center; box-shadow: 0 4px 14px rgba(0,0,0,.35); }
#mini { position: absolute; right: max(14px, env(safe-area-inset-right, 0px)); bottom: max(14px, env(safe-area-inset-bottom, 0px)); width: 300px; display: grid; gap: 8px; transition: width .18s ease; }
#mini .mapbox { position: relative; height: 200px; border-radius: 12px; overflow: hidden; box-shadow: 0 8px 26px rgba(0,0,0,.45), inset 0 0 0 1px var(--line); transition: height .18s ease; background: #a9cbe0; opacity: .82; }
#mini:hover .mapbox, #mini.big .mapbox { opacity: 1; }
@media (hover: hover) { #mini:hover { width: min(560px, calc(100vw - 32px)); } #mini:hover .mapbox { height: min(380px, 55vh); } }
#mini.big { width: min(720px, calc(100vw - 32px)); } #mini.big .mapbox { height: min(500px, 62vh); }
#miniMap { position: absolute; inset: 0; }
.map-canvas { display: block; touch-action: none; cursor: crosshair; }
#mapSize { position: absolute; top: 8px; left: 8px; width: 30px; height: 30px; z-index: 2; border-radius: 8px; font-size: 14px; }
#guessBtn { width: 100%; padding: 13px; font-size: 16px; }
#mapToggle { display: none; }
@media (max-width: 700px) {
  #mini { width: auto; left: max(12px, env(safe-area-inset-left, 0px)); display: none; }
  #mini.open { display: grid; }
  #mini .mapbox, #mini.big .mapbox { height: 52vh; opacity: 1; }
  #mapToggle { display: grid; position: absolute; right: max(14px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); width: auto; padding: 0 18px; height: 50px; background: var(--brand); color: var(--brand-ink); font-weight: 800; }
  #mini.open ~ #mapToggle { bottom: auto; top: max(110px, env(safe-area-inset-top, 0px)); height: 42px; }
  .hud.team .tname { font-size: 13px; } .mid { min-width: 70px; padding: 6px 8px; }
  #moveCtl { bottom: 84px; }
}

/* ---------- result & end overlays */
.overlay { position: fixed; inset: 0; z-index: 5; display: grid; grid-template-rows: minmax(0, 1fr) auto; background: var(--ink); }
#resultMap { position: relative; min-height: 200px; }
#resultMap .map-canvas { cursor: grab; }
.rpanel { background: var(--panel-solid); border-top: 1px solid var(--line); padding-block: 16px max(18px, env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.rinner { max-width: 980px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px 24px; align-items: center; }
@media (max-width: 700px) { .rinner { grid-template-columns: minmax(0,1fr); } }
#resultBody { display: grid; gap: 10px; min-width: 0; }
.where { display: flex; align-items: center; gap: 12px; }
.where b { font-family: var(--f-display); font-size: 26px; font-weight: 800; display: block; line-height: 1.05; }
.where small { color: var(--muted); font-size: 13px; }
.flagchip { font-family: var(--f-mono); font-weight: 700; font-size: 13px; padding: 6px 8px; border-radius: 6px; background: var(--brand); color: var(--brand-ink); }
.dmg { margin: 0; font-size: 15px; } .dmg b { color: var(--brand); font-family: var(--f-mono); }
.hpmini { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.hpmini > div { display: grid; gap: 4px; font-size: 12px; font-weight: 700; }
.hpmini .t0 span { color: var(--red); } .hpmini .t1 span { color: var(--blue); text-align: right; }
.rows { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: 6px; }
.rows li { display: grid; grid-template-columns: minmax(0,1fr) auto auto; gap: 10px; align-items: center; padding: 7px 10px; border-radius: 9px; background: rgba(255,255,255,.04); border-left: 3px solid var(--c); font-size: 14px; }
.rows li.t0 { --c: var(--red); } .rows li.t1 { --c: var(--blue); }
.rows li.best { background: rgba(242,193,78,.1); }
.rows .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; } .rows em { font-style: normal; color: var(--muted); font-size: 11px; font-weight: 500; }
.rows .km { color: var(--muted); font-family: var(--f-mono); font-size: 12px; } .rows .pts { font-family: var(--f-mono); font-weight: 700; font-variant-numeric: tabular-nums; }
.soloRes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.soloRes div { position: relative; padding: 10px 12px; border-radius: 10px; background: rgba(255,255,255,.04); overflow: hidden; }
.soloRes span { display: block; font-size: 11px; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; font-weight: 600; }
.soloRes b { font-family: var(--f-mono); font-size: 24px; }
.soloRes i { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--brand); }
.next { display: grid; gap: 6px; justify-items: end; } @media (max-width: 700px) { .next { justify-items: stretch; } }
#nextInfo { font-size: 13px; color: var(--muted); }
#endOv { background: rgba(8,12,16,.86); place-items: center; grid-template-rows: auto; z-index: 6; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.endbox { width: min(560px, 100%); background: var(--panel-solid); border-radius: 18px; padding: 26px; box-shadow: inset 0 0 0 1px var(--line), 0 30px 80px rgba(0,0,0,.5); display: grid; gap: 14px; max-height: 90vh; overflow: auto; }
.endbox h2 { font-family: var(--f-display); font-size: 44px; font-weight: 800; margin: 0; line-height: 1; letter-spacing: -.02em; }
.endbox h2.t0 { color: var(--red); } .endbox h2.t1 { color: var(--blue); }
.endbox h2 small { font-size: 20px; color: var(--muted); }
.endbox p { margin: 0; color: var(--muted); }
.hist { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.hist li { display: grid; grid-template-columns: 80px minmax(0,1fr) auto; gap: 10px; padding: 7px 10px; border-radius: 8px; background: rgba(255,255,255,.04); font-size: 14px; }
.hist li span:first-child { color: var(--muted); } .hist li span:last-child { font-family: var(--f-mono); font-size: 13px; }
#toast { position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 10; background: var(--paper); color: var(--ink); padding: 10px 16px; border-radius: 10px; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,.4); max-width: calc(100% - 32px); }
#loading { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: var(--ink); font-family: var(--f-display); font-size: 28px; font-weight: 800; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* settings & matchmaking */
.gear { position: fixed; z-index: 8; top: max(14px, env(safe-area-inset-top, 0px)); right: max(14px, env(safe-area-inset-right, 0px)); }
body.ingame .gear { top: auto; right: auto; left: max(12px, env(safe-area-inset-left, 0px)); bottom: max(176px, calc(env(safe-area-inset-bottom, 0px) + 164px)); }
.gear .eq { display: none; gap: 2px; align-items: flex-end; height: 14px; margin-left: 6px; }
body.music-on .gear .eq { display: inline-flex; }
.gear .eq i { width: 3px; background: var(--brand); border-radius: 1px; animation: eq 1s ease-in-out infinite; }
.gear .eq i:nth-child(2) { animation-delay: .25s; } .gear .eq i:nth-child(3) { animation-delay: .5s; }
@keyframes eq { 0%,100% { height: 4px; } 50% { height: 14px; } }
.gearbtn { display: inline-flex; align-items: center; gap: 4px; height: 42px; padding: 0 12px; border-radius: 10px; background: var(--panel); color: var(--paper); box-shadow: inset 0 0 0 1px var(--line); }
.gearbtn:hover { background: #1b2733; }
#settings { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: rgba(8,12,16,.72); padding: 16px; }
.setbox { width: min(560px, 100%); max-height: 90vh; overflow: auto; background: var(--panel-solid); border-radius: 18px; padding: 22px; box-shadow: inset 0 0 0 1px var(--line), 0 30px 80px rgba(0,0,0,.5); display: grid; gap: 18px; }
.setbox h2 { margin: 0; font-family: var(--f-display); font-size: 30px; font-weight: 800; }
.sethead { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.setrow { display: grid; gap: 10px; }
.switch { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.switch label.tog { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; cursor: pointer; }
.switch input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--brand); }
.switch input[type=range] { flex: 1; min-width: 140px; accent-color: var(--brand); }
#stations { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 150px), 1fr)); gap: 8px; }
.station { text-align: left; background: rgba(255,255,255,.05); color: var(--paper); box-shadow: inset 0 0 0 1.5px var(--line); font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 10px; padding: 11px 12px; }
.station i { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,.2); flex: none; }
.station.on { box-shadow: inset 0 0 0 2px var(--brand); background: rgba(242,193,78,.1); }
.station.on i { background: var(--brand); box-shadow: 0 0 0 4px rgba(242,193,78,.2); }
#nowPlaying { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
#mm { position: fixed; inset: 0; z-index: 12; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 40%, rgba(18,27,36,.97), rgba(8,12,16,.995)); padding: 16px; }
.mmbox { width: min(520px, 100%); display: grid; gap: 18px; justify-items: center; text-align: center; }
.radar { width: 180px; height: 180px; border-radius: 50%; position: relative; background: repeating-radial-gradient(circle, rgba(242,193,78,.14) 0 1px, transparent 1px 30px); box-shadow: inset 0 0 0 2px rgba(242,193,78,.35); overflow: hidden; }
.radar::before { content: ""; position: absolute; inset: 0; background: conic-gradient(from 0deg, rgba(242,193,78,.45), transparent 25%); animation: spin 2.4s linear infinite; }
.radar::after { content: ""; position: absolute; left: 50%; top: 50%; width: 12px; height: 12px; margin: -6px; border-radius: 50%; background: var(--brand); box-shadow: 0 0 0 6px rgba(242,193,78,.25); }
.mmbox h2 { white-space: nowrap; margin: 0; font-family: var(--f-display); font-size: 36px; font-weight: 800; }
.mmbox h2 .dots::after { content: ""; animation: dots 1.4s steps(4) infinite; }
@keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
#mmSub { color: var(--muted); font-weight: 600; }
#mmSlots { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.slot { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; background: rgba(255,255,255,.05); box-shadow: inset 0 0 0 2px rgba(255,255,255,.12); color: var(--paper); }
.slot:not(.on) { animation: pulse 1.6s infinite; }
.slot.on { background: var(--blue); box-shadow: none; }
.slot.me { background: var(--brand); color: var(--brand-ink); }
#mmFound { font-family: var(--f-mono); font-weight: 700; }
#mmNames { color: var(--muted); font-size: 14px; min-height: 1em; }
.mmbar { width: 100%; height: 6px; border-radius: 99px; background: rgba(255,255,255,.08); overflow: hidden; }
#mmBar { height: 100%; width: 0; background: var(--brand); transition: width .2s linear; }
#mmTimer { font-size: 14px; color: var(--muted); }
</style>
</head>
<body>
<div id="backdrop" aria-hidden="true"></div>
<div id="view"></div>

<div class="gear"><button class="gearbtn" data-settings data-i18n-title="settings"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span></button></div>

<section id="home" class="screen">
  <div class="scrim"></div>
  <div class="wrap"><div class="inner">
    <div class="brand"><h1>Gl<span class="o" aria-hidden="true"></span>btrop</h1><p data-i18n="tagline"></p></div>
    <div class="homegrid">
      <div style="display:grid;gap:18px;min-width:0">
        <div class="nickrow"><label class="label" for="nick" data-i18n="nick"></label><input id="nick" type="text" maxlength="16" data-i18n-ph="nickPh" autocomplete="off"></div>
        <div class="cards">
          <button class="card" id="soloCard"><svg width="120" height="120" viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="6"><circle cx="60" cy="60" r="44"/><path d="M60 16v88M16 60h88"/></svg><span class="k" data-i18n="solo"></span><span class="d" data-i18n="soloD"></span><span class="tag alt" data-i18n="soloTag"></span></button>
          <button class="card" id="teamCard"><svg width="120" height="120" viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="6"><circle cx="40" cy="48" r="20"/><circle cx="82" cy="48" r="20"/><path d="M10 104c4-22 56-22 60 0M52 104c4-22 56-22 60 0"/></svg><span class="k" data-i18n="team"></span><span class="d" data-i18n="teamD"></span><span class="tag" data-i18n="teamTag"></span></button>
        </div>
        <div class="legend">
          <div><b data-i18n="mv.move"></b><span data-i18n="mv.move.l"></span></div>
          <div><b data-i18n="mv.nomove"></b><span data-i18n="mv.nomove.l"></span></div>
          <div><b data-i18n="mv.nmpz"></b><span data-i18n="mv.nmpz.l"></span></div>
        </div>
      </div>
      <div style="display:grid;gap:18px;min-width:0">
        <div class="panel qp">
          <h2 data-i18n="quick"></h2>
          <p class="muted" style="margin:0" data-i18n="quickD"></p>
          <div class="seg" role="radiogroup">
            <label><input type="radio" name="qmv" value="move"><span data-i18n="mv.move"></span></label>
            <label><input type="radio" name="qmv" value="nomove"><span data-i18n="mv.nomove"></span></label>
            <label><input type="radio" name="qmv" value="nmpz"><span data-i18n="mv.nmpz"></span></label>
          </div>
          <div class="qpbtns"><button data-qp="1">1v1</button><button data-qp="2">2v2</button><button data-qp="3">3v3</button><button data-qp="4">4v4</button></div>
        </div>
        <div class="panel">
          <h2 data-i18n="friends"></h2>
          <div id="joinRow"><input id="joinCode" type="text" maxlength="8" data-i18n-ph="codePh" autocomplete="off"><button id="joinBtn" data-i18n="join"></button></div>
          <div id="openRooms"></div>
          <p class="muted" style="margin:0" data-i18n="friendsHint"></p>
        </div>
      </div>
    </div>
  </div></div>
</section>

<section id="setup" class="screen" hidden>
  <div class="scrim"></div>
  <div class="wrap"><div class="setupbox">
    <div><button class="ghost small" data-home data-i18n="back"></button></div>
    <h2 id="setupTitle"></h2>
    <div class="opt"><span class="label" data-i18n="mode"></span><div class="seg">
      <label><input type="radio" name="mv" value="move"><span><i data-i18n="mv.move"></i><small data-i18n="mv.move.s"></small></span></label>
      <label><input type="radio" name="mv" value="nomove"><span><i data-i18n="mv.nomove"></i><small data-i18n="mv.nomove.s"></small></span></label>
      <label><input type="radio" name="mv" value="nmpz"><span><i data-i18n="mv.nmpz"></i><small data-i18n="mv.nmpz.s"></small></span></label>
    </div></div>
    <div class="opt" id="rivalRow"><span class="label" data-i18n="rival"></span><div class="seg">
      <label><input type="radio" name="rival" value="none"><span><i data-i18n="rivalNone"></i><small data-i18n="rivalNoneS"></small></span></label>
      <label><input type="radio" name="rival" value="bot"><span><i data-i18n="rivalBot"></i><small data-i18n="rivalBotS"></small></span></label>
    </div></div>
    <div class="opt" id="sizeRow"><span class="label" data-i18n="teams"></span><div class="seg">
      <label><input type="radio" name="size" value="1"><span>1v1</span></label>
      <label><input type="radio" name="size" value="2"><span>2v2</span></label>
      <label><input type="radio" name="size" value="3"><span>3v3</span></label>
      <label><input type="radio" name="size" value="4"><span>4v4</span></label>
    </div></div>
    <div class="opt"><span class="label" data-i18n="time"></span><div class="seg">
      <label><input type="radio" name="tl" value="0"><span data-i18n="noLimit"></span></label>
      <label><input type="radio" name="tl" value="120"><span>2:00</span></label>
      <label><input type="radio" name="tl" value="60"><span>1:00</span></label>
      <label><input type="radio" name="tl" value="30"><span>0:30</span></label>
    </div></div>
    <div class="opt" id="botRow"><span class="label" data-i18n="botLevel"></span>
      <div class="lvlbox"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap"><span id="lvlName"></span><span class="muted" id="lvlDesc"></span></div>
        <input id="lvl" type="range" min="1" max="10" step="1" value="5" data-i18n-title="botLevel">
        <div class="ticks"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>10</span></div>
      </div>
    </div>
    <div class="actions"><button id="setupGo"></button><button id="friendsBtn" class="ghost" data-i18n="friendsRoom"></button></div>
  </div></div>
</section>

<section id="lobby" class="screen" hidden>
  <div class="scrim"></div>
  <div class="wrap"><div class="lobbybox">
    <div><button class="ghost small" data-home data-i18n="leave"></button></div>
    <div class="lobbyhead"><div><span class="label" data-i18n="lobby"></span><h2 data-i18n="lineup"></h2><div class="muted" id="lobbyInfo"></div></div>
      <div id="codeRow"><span class="label" data-i18n="code"></span><span id="lobbyCode"></span><button class="ghost small" id="copyCode" data-i18n="copy"></button></div></div>
    <div id="lobbyTeams"></div>
    <div class="actions" id="lobbyHostCtl"><button id="startBtn" data-i18n="start"></button><button class="ghost" id="fillBots" data-i18n="fill"></button><button class="ghost" id="clearBots" data-i18n="clear"></button></div>
    <p class="muted" id="guestWait" hidden data-i18n="guestWait"></p>
  </div></div>
</section>

<section id="game" class="screen" hidden>
  <div id="hud" class="hud"></div>
  <div class="topleft">
    <div class="compass" data-i18n-title="compass"><svg id="needle" viewBox="0 0 44 44"><path d="M22 4 L27 22 L22 20 L17 22 Z" fill="#e5484d"/><path d="M22 40 L17 22 L22 24 L27 22 Z" fill="#dfe5ea"/></svg></div>
    <span class="badge" id="mvBadge"></span>
  </div>
  <div class="leftctl">
    <button class="iconbtn" id="toStart" data-i18n-title="toStart"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 21V4"/><path d="M5 4h11l-2 4 2 4H5"/></svg></button>
    <div id="zoomCtl" style="display:grid;gap:8px"><button class="iconbtn" id="zin" data-i18n-title="zoomIn">+</button><button class="iconbtn" id="zout" data-i18n-title="zoomOut">−</button></div>
  </div>
  <div id="moveCtl"><button id="back" data-i18n-title="backMove"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M6 9l6 6 6-6"/></svg></button><button id="fwd" data-i18n-title="fwd"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M6 15l6-6 6 6"/></svg></button></div>
  <div id="mini"><div class="mapbox"><div id="miniMap"></div><button class="iconbtn" id="mapSize" data-i18n-title="bigMap">⤢</button></div><button id="guessBtn" disabled></button></div>
  <button id="mapToggle" data-i18n="map"></button>
</section>

<section id="resultOv" class="overlay" hidden>
  <div id="resultMap"></div>
  <div class="rpanel"><div class="rinner"><div id="resultBody"></div><div class="next"><button id="nextBtn"></button><span id="nextInfo"></span></div></div></div>
</section>
<section id="endOv" class="overlay" hidden>
  <div class="endbox"><div id="endBody"></div><div class="actions"><button id="againBtn" data-i18n="again"></button><button class="ghost" data-home data-i18n="menu"></button></div></div>
</section>

<div id="mm" hidden><div class="mmbox">
  <div class="radar" aria-hidden="true"></div>
  <h2><span data-i18n="mmTitle"></span><span class="dots"></span></h2>
  <div id="mmSub"></div>
  <div id="mmSlots"></div>
  <div id="mmFound"></div>
  <div id="mmNames"></div>
  <div class="mmbar"><div id="mmBar"></div></div>
  <div id="mmTimer"></div>
  <div class="actions" style="justify-content:center"><button id="mmStart" data-i18n="mmStartNow" hidden></button><button class="ghost" id="mmCancel" data-i18n="mmCancel"></button></div>
</div></div>

<div id="settings" hidden><div class="setbox" role="dialog" aria-modal="true">
  <div class="sethead"><h2 data-i18n="settings"></h2><button class="ghost small" id="settingsClose" data-i18n="close"></button></div>
  <div class="setrow"><span class="label" data-i18n="language"></span><div class="seg" id="langSeg"></div></div>
  <div class="setrow"><span class="label" data-i18n="radio"></span>
    <div class="switch"><label class="tog"><input type="checkbox" id="musicOn"><span data-i18n="music"></span></label><input type="range" id="musicVol" min="0" max="100" data-i18n-title="volume"><button class="ghost small" id="nextTrack" data-i18n="nextTrack"></button></div>
    <div id="stations"></div>
    <div id="nowPlaying"></div>
  </div>
  <div class="setrow"><span class="label" data-i18n="sfx"></span>
    <div class="switch"><label class="tog"><input type="checkbox" id="sfxOn"><span data-i18n="on"></span></label><input type="range" id="sfxVol" min="0" max="100" data-i18n-title="volume"></div>
  </div>
</div></div>

<div id="toast" hidden></div>
<div id="loading">…</div>
<div id="searching" hidden><i></i><span data-i18n="searchingPlace"></span></div>
<div id="noKey" hidden><div class="endbox"><h2>Brakuje klucza</h2><p id="noKeyMsg">Otwórz plik <code>config.js</code> i wklej swój klucz Google Maps w miejsce <code>WKLEJ_TUTAJ_KLUCZ</code>. Instrukcja jest w pliku README.md.</p></div></div>

<script src="config.js?v=4"></script>
<script src="i18n.js?v=4"></script>
<script src="meta.js?v=4"></script>
<script src="data.js?v=4"></script>
<script src="util.js?v=4"></script>
<script src="world.js?v=4"></script>
<script src="map.js?v=4"></script>
<script src="bots.js?v=4"></script>
<script src="street.js?v=4"></script>
<script src="net.js?v=5"></script>
<script src="audio.js?v=4"></script>
<script src="game.js?v=4"></script>
<script>
(function () {
  const cfg = window.GLOBTROP_CONFIG || {};
  const $ = s => document.querySelector(s);
  GTi18n.applyDom(); $('#loading').textContent = GTi18n.t('loading');
  function fail(msg) { $('#loading').hidden = true; $('#noKey').hidden = false; if (msg) $('#noKeyMsg').innerHTML = msg; }
  function load(src) { return new Promise((ok, err) => { const s = document.createElement('script'); s.src = src; s.async = true; s.onload = ok; s.onerror = err; document.head.appendChild(s); }); }
  window.gm_authFailure = () => fail('Google odrzucił klucz. Sprawdź, czy w Google Cloud jest włączone <code>Maps JavaScript API</code>, podpięte płatności i czy adres tej strony jest dodany w ograniczeniach klucza.');
  window.__gt_maps = async function () {
    try {
      if (cfg.firebase) { try { await load('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js'); await load('https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js'); } catch (e) { console.warn('Firebase', e); } }
      GTGame.init();
      new GTMap($('#backdrop'), {});
    } catch (e) { console.error(e); fail('Nie udało się uruchomić gry: ' + e.message); return; }
    $('#loading').hidden = true;
  };
  if (!cfg.googleMapsKey || cfg.googleMapsKey === 'WKLEJ_TUTAJ_KLUCZ') { fail(); return; }
  load('https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(cfg.googleMapsKey) + '&v=weekly&language=' + GTi18n.lang + '&loading=async&callback=__gt_maps').catch(() => fail('Nie udało się połączyć z Google Maps. Sprawdź internet i odśwież stronę.'));
})();
</script>
</body>
</html>
